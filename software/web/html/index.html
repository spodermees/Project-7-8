<!DOCTYPE html>
<html>
<head>
  <title>Live Sensor Data</title>
</head>
<body>
  <h1>Sensor Updates:</h1>
  <div id="sensorData">Waiting for data...</div>

  <script>
    const ws = new WebSocket("ws://172.20.10.2:9002");

    ws.onmessage = (event) => {
      document.getElementById("sensorData").innerText = event.data;
    };

    ws.onopen = () => {
      console.log("Connected to WebSocket server");
    };

    ws.onclose = () => {
      console.log("WebSocket connection closed");
    };
  </script>
</body>
</html>
